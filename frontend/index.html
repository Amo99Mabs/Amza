<!DOCTYPE html>
<html>
<head>
  <title>Amza Bot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Meet Amza !</h1>
  
   <!-- Chat container -->
  <div id="chatContainer">
    <div id="chatIcon">

    </div>
    <input type="text" id="userInput" placeholder="Ask Amza about Amo...">
    <button id="sendBtn" onclick="sendMessage()">➤</button>
  </div>

  <!-- Chat history box -->
  <div id="chatBox"></div>


  <script src="app.js"></script>
</body>
</html>
